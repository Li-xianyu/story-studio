<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Studio Sync · 管理面板</title>
<style>
/* ===== Reset & Tokens ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg-base: #000000;
  --bg-surface: #0a0a0c;
  --bg-elevated: #141416;
  --glass-bg: rgba(20,20,24,0.52);
  --glass-bg-thick: rgba(16,16,20,0.76);
  --glass-border: rgba(255,255,255,0.08);
  --glass-border-strong: rgba(255,255,255,0.15);
  --text-primary: #ffffff;
  --text-secondary: rgba(235,235,245,0.6);
  --text-tertiary: rgba(235,235,245,0.3);
  --separator: rgba(84,84,88,0.65);
  --accent: #0a84ff;
  --accent-glass: rgba(10,132,255,0.18);
  --green: #30d158;
  --green-glass: rgba(48,209,88,0.22);
  --red: #ff453a;
  --red-glass: rgba(255,69,58,0.22);
  --orange: #ff9f0a;
  --purple: #bf5af2;
  --teal: #64d2ff;
  --radius-sm: 14px;
  --radius-md: 18px;
  --radius-xs: 8px;
  --shadow-float: 0 16px 48px rgba(0,0,0,0.38), 0 3px 12px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  color-scheme: dark;
  background: var(--bg-base);
  color: var(--text-primary);
}

body {
  min-height: 100vh;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(120,120,255,0.08), transparent),
    radial-gradient(ellipse 60% 40% at 80% 80%, rgba(10,132,255,0.06), transparent),
    var(--bg-base);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px;
}

/* ===== Header ===== */
.header {
  text-align: center;
  padding: 32px 0 24px;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff 0%, rgba(255,255,255,0.7) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.header p {
  font-size: 13px;
  color: var(--text-tertiary);
  margin-top: 6px;
}

/* ===== Card ===== */
.card {
  width: 100%;
  max-width: 860px;
  background: var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-float);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  padding: 24px;
  margin-bottom: 20px;
}

/* ===== Connect Bar ===== */
.connect-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  flex-wrap: wrap;
}
.connect-row .field {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
  min-width: 180px;
}
.connect-row .field label {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
}
.connect-row .field input {
  background: rgba(255,255,255,0.06);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xs);
  color: var(--text-primary);
  padding: 9px 12px;
  font-size: 14px;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  outline: none;
  transition: border-color 0.2s;
}
.connect-row .field input:focus {
  border-color: var(--accent);
}
.connect-row .field input::placeholder {
  color: var(--text-tertiary);
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 9px 18px;
  border-radius: var(--radius-xs);
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  font-family: inherit;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
}
.btn-primary:hover { filter: brightness(1.15); }
.btn-primary:disabled { opacity: 0.4; cursor: default; filter: none; }
.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--text-secondary);
  border: 1px solid var(--glass-border);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }
.btn-danger {
  background: var(--red-glass);
  color: var(--red);
  border: 1px solid rgba(255,69,58,0.2);
}
.btn-danger:hover { background: rgba(255,69,58,0.28); }
.btn-sm { padding: 5px 12px; font-size: 12px; }

/* ===== Status ===== */
.status-row {
  display: flex;
  gap: 16px;
  margin-top: 16px;
  flex-wrap: wrap;
}
.stat-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 600;
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--glass-border);
}
.stat-chip .dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--text-tertiary);
}
.stat-chip .dot.ok { background: var(--green); }
.stat-chip .dot.err { background: var(--red); }

/* ===== Section ===== */
.section-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-tertiary);
  margin: 24px 0 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.section-title::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--separator);
}

/* ===== Story Table ===== */
.table-wrap {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  text-align: left;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-tertiary);
  padding: 8px 12px;
  border-bottom: 1px solid var(--glass-border);
}
td {
  padding: 10px 12px;
  border-bottom: 1px solid rgba(255,255,255,0.04);
  vertical-align: middle;
}
tr:hover td { background: rgba(255,255,255,0.02); }
.mono {
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 11px;
  color: var(--text-tertiary);
}
.story-title-cell {
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-weight: 600;
}

/* ===== JSON Viewer ===== */
.json-block {
  background: rgba(0,0,0,0.4);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-xs);
  padding: 14px 16px;
  font-family: "SF Mono", "Fira Code", "Consolas", monospace;
  font-size: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
  word-break: break-all;
  max-height: 400px;
  overflow-y: auto;
  color: var(--text-secondary);
}

/* ===== Toast ===== */
.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--bg-elevated);
  border: 1px solid var(--glass-border);
  border-radius: var(--radius-sm);
  padding: 12px 24px;
  font-size: 13px;
  box-shadow: var(--shadow-float);
  z-index: 999;
  animation: toastIn 0.3s ease;
  pointer-events: none;
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(12px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.toast.err { border-color: rgba(255,69,58,0.4); color: var(--red); }

/* ===== Dialog ===== */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.dialog {
  background: var(--glass-bg-thick);
  border: 1px solid var(--glass-border-strong);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-float);
  backdrop-filter: blur(32px);
  -webkit-backdrop-filter: blur(32px);
  padding: 24px;
  width: 90vw;
  max-width: 720px;
  max-height: 80vh;
  overflow-y: auto;
  animation: slideUp 0.25s ease;
}
@keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
.dialog h3 { font-size: 18px; margin-bottom: 16px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* ===== Spinner ===== */
.spinner {
  display: inline-block;
  width: 16px; height: 16px;
  border: 2px solid rgba(255,255,255,0.2);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== Loading overlay ===== */
.loading-overlay {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 40px;
  color: var(--text-secondary);
  font-size: 14px;
}

.hidden { display: none !important; }

/* ===== Responsive ===== */
@media (max-width: 600px) {
  body { padding: 12px; }
  .card { padding: 16px; }
  .connect-row { flex-direction: column; }
  .connect-row .btn { width: 100%; justify-content: center; }
}
</style>
</head>
<body>

<div class="header">
  <h1>☁️ Story Studio Sync</h1>
  <p>Cloudflare Worker 管理面板</p>
</div>

<!-- ==== 连接卡片 ==== -->
<div class="card" id="connectCard">
  <div class="connect-row">
    <div class="field">
      <label>Worker 地址</label>
      <input type="url" id="hostInput" placeholder="https://story-studio-sync.你的域名.workers.dev" autocomplete="url">
    </div>
    <div class="field">
      <label>Sync Token</label>
      <input type="password" id="tokenInput" placeholder="48 位 hex token" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="connectBtn" onclick="doConnect()">🔗 连接</button>
  </div>
  <div id="statusRow" class="status-row hidden"></div>
</div>

<!-- ==== 概览卡片 ==== -->
<div class="card hidden" id="overviewCard">
  <div class="section-title">📊 概览</div>
  <div style="display:flex;gap:12px;flex-wrap:wrap;" id="overviewChips"></div>
</div>

<!-- ==== 故事列表 ==== -->
<div class="card hidden" id="storiesCard">
  <div class="section-title" style="margin-top:0">📚 故事列表 <span id="storyCount" style="color:var(--text-tertiary);font-weight:400"></span></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>标题</th>
          <th>ID</th>
          <th>章节数</th>
          <th>总字数</th>
          <th>updatedAt</th>
          <th>syncedAt</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="storyTableBody"></tbody>
    </table>
  </div>
  <div id="storyLoading" class="loading-overlay hidden"><span class="spinner"></span> 加载中...</div>
</div>

<!-- ==== 设置卡片 ==== -->
<div class="card hidden" id="settingsCard">
  <div class="section-title" style="margin-top:0">⚙️ 云端设置</div>
  <div class="json-block" id="settingsJson"></div>
</div>

<!-- ==== 原始数据卡片 ==== -->
<div class="card hidden" id="rawCard">
  <div class="section-title">🗄️ KV 原始数据 (sync/pull)</div>
  <div class="json-block" id="rawJson"></div>
</div>

<!-- ==== 故事详情对话框 ==== -->
<div class="overlay hidden" id="storyDialogOverlay" onclick="if(event.target===this)closeStoryDialog()">
  <div class="dialog" id="storyDialog">
    <h3 id="storyDialogTitle">故事详情</h3>
    <div class="json-block" id="storyDialogContent" style="max-height:50vh"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost btn-sm" onclick="copyStoryJson()">📋 复制 JSON</button>
      <button class="btn btn-danger btn-sm" id="storyDialogDeleteBtn" onclick="deleteStoryFromDialog()">🗑 删除此故事</button>
      <button class="btn btn-ghost btn-sm" onclick="closeStoryDialog()">关闭</button>
    </div>
  </div>
</div>

<script>
/* ===== 状态 ===== */
var HOST = "";
var TOKEN = "";
var STORIES = [];
var CURRENT_STORY_ID = null;

/* ===== DOM refs ===== */
var $ = function(id) { return document.getElementById(id); };

/* ===== Toast ===== */
function showToast(msg, isErr) {
  var t = document.createElement("div");
  t.className = "toast" + (isErr ? " err" : "");
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(function() { t.remove(); }, 2800);
}

/* ===== API 请求 ===== */
function api(path, method, body) {
  var headers = { "Content-Type": "application/json", "X-Sync-Token": TOKEN };
  return fetch(HOST + path, { method: method || "GET", headers: headers, body: body ? JSON.stringify(body) : undefined })
    .then(function(r) {
      return r.json().then(function(data) {
        if (!r.ok) throw new Error(data.error || ("HTTP " + r.status));
        return data;
      });
    });
}

/* ===== 连接 ===== */
function doConnect() {
  HOST = $("hostInput").value.trim().replace(/\/+$/, "");
  TOKEN = $("tokenInput").value.trim();

  if (!HOST) { showToast("请输入 Worker 地址", true); return; }
  if (!/^https?:\/\//i.test(HOST)) { showToast("地址必须以 http:// 或 https:// 开头", true); return; }
  if (!TOKEN) { showToast("请输入 Sync Token", true); return; }

  var btn = $("connectBtn");
  btn.disabled = true;
  btn.textContent = "⏳ 连接中...";

  api("/ping")
    .then(function(data) {
      showToast("✅ 连接成功！故事数: " + (data.storyCount || 0));
      btn.textContent = "✅ 已连接";
      btn.classList.remove("btn-primary");
      btn.classList.add("btn-ghost");

      // 显示状态
      var row = $("statusRow");
      row.classList.remove("hidden");
      row.innerHTML =
        '<span class="stat-chip"><span class="dot ok"></span> 已连接</span>' +
        '<span class="stat-chip">🕐 Token 创建: ' + (data.tokenCreatedAt ? new Date(data.tokenCreatedAt).toLocaleString() : "未知") + '</span>' +
        '<span class="stat-chip">📚 ' + (data.storyCount || 0) + ' 个故事</span>' +
        '<span class="stat-chip mono" style="font-size:11px" title="' + escapeHtml(TOKEN) + '">🔑 ' + TOKEN.slice(0,8) + '…</span>';

      // 加载所有数据
      loadAllData();
    })
    .catch(function(err) {
      showToast("❌ 连接失败: " + err.message, true);
      btn.disabled = false;
      btn.textContent = "🔗 连接";
    });
}

/* ===== 回车连接 ===== */
$("tokenInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") doConnect();
});
$("hostInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") $("tokenInput").focus();
});

/* ===== 加载所有数据 ===== */
function loadAllData() {
  // 并行加载 stories metadata + settings + full pull
  Promise.all([
    api("/stories"),
    api("/settings"),
    api("/sync/pull")
  ]).then(function(results) {
    var meta = results[0];
    var settings = results[1];
    var full = results[2];

    STORIES = full.stories || [];

    // 概览
    renderOverview(meta, settings, full);

    // 故事列表
    renderStoryTable(STORIES);

    // 设置
    renderSettings(settings);

    // 原始数据
    renderRaw(full);

    // 显示所有卡片
    $("overviewCard").classList.remove("hidden");
    $("storiesCard").classList.remove("hidden");
    $("settingsCard").classList.remove("hidden");
    $("rawCard").classList.remove("hidden");
  }).catch(function(err) {
    showToast("❌ 加载数据失败: " + err.message, true);
  });
}

/* ===== 概览 ===== */
function renderOverview(meta, settings, full) {
  var stories = full.stories || [];
  var totalChapters = 0;
  var totalChars = 0;
  stories.forEach(function(s) {
    totalChapters += (s.chapters || []).length;
    (s.chapters || []).forEach(function(ch) {
      (ch.segments || []).forEach(function(seg) {
        totalChars += (seg.content || "").length;
      });
    });
  });

  var chips = [
    { label: "故事总数", value: stories.length },
    { label: "章节总数", value: totalChapters },
    { label: "总字数", value: totalChars.toLocaleString() },
    { label: "设置键数", value: Object.keys(settings || {}).length },
    { label: "索引条目", value: (full.index || []).length },
    { label: "拉取时间", value: full.pulledAt ? new Date(full.pulledAt).toLocaleString() : "-" }
  ];

  $("overviewChips").innerHTML = chips.map(function(c) {
    return '<div class="stat-chip" style="flex-direction:column;align-items:flex-start;gap:2px;padding:10px 16px">' +
      '<span style="font-size:10px;color:var(--text-tertiary);text-transform:uppercase;letter-spacing:0.04em">' + c.label + '</span>' +
      '<span style="font-size:16px;font-weight:700">' + c.value + '</span>' +
      '</div>';
  }).join("");
}

/* ===== 故事表格 ===== */
function renderStoryTable(stories) {
  $("storyCount").textContent = "(" + stories.length + ")";
  var tbody = $("storyTableBody");

  if (stories.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px;color:var(--text-tertiary)">暂无故事</td></tr>';
    return;
  }

  tbody.innerHTML = stories.map(function(s) {
    var chapters = s.chapters || [];
    var charCount = 0;
    chapters.forEach(function(ch) {
      (ch.segments || []).forEach(function(seg) {
        charCount += (seg.content || "").length;
      });
    });

    return '<tr>' +
      '<td class="story-title-cell" title="' + escapeHtml(s.title || "未命名") + '">' + escapeHtml(s.title || "未命名") + '</td>' +
      '<td class="mono" title="' + escapeHtml(s.id) + '">' + escapeHtml((s.id || "").slice(0,12)) + '…</td>' +
      '<td>' + chapters.length + '</td>' +
      '<td>' + charCount.toLocaleString() + '</td>' +
      '<td class="mono">' + (s.updatedAt ? new Date(s.updatedAt).toLocaleString() : "-") + '</td>' +
      '<td class="mono">' + (s.syncedAt ? new Date(s.syncedAt).toLocaleString() : "-") + '</td>' +
      '<td>' +
        '<button class="btn btn-ghost btn-sm" onclick="viewStory(\'' + escapeHtml(s.id) + '\')">🔍 查看</button> ' +
        '<button class="btn btn-danger btn-sm" onclick="deleteStory(\'' + escapeHtml(s.id) + '\',\'' + escapeHtml(s.title || "未命名").replace(/'/g,"\\'") + '\')">🗑</button>' +
      '</td>' +
      '</tr>';
  }).join("");
}

/* ===== 设置 ===== */
function renderSettings(settings) {
  $("settingsJson").textContent = JSON.stringify(settings, null, 2);
}

/* ===== 原始数据 ===== */
function renderRaw(full) {
  // Don't show full story bodies in raw view, just metadata
  var summary = {
    pulledAt: full.pulledAt,
    index: full.index,
    settings: full.settings,
    storyCount: (full.stories || []).length,
    stories: (full.stories || []).map(function(s) {
      return {
        id: s.id,
        title: s.title,
        chapterCount: (s.chapters || []).length,
        updatedAt: s.updatedAt,
        syncedAt: s.syncedAt
      };
    })
  };
  $("rawJson").textContent = JSON.stringify(summary, null, 2);
}

/* ===== 查看故事详情 ===== */
function viewStory(id) {
  var story = STORIES.find(function(s) { return s.id === id; });
  if (!story) {
    // Fallback: fetch individually
    $("storyLoading").classList.remove("hidden");
    api("/stories/" + encodeURIComponent(id)).then(function(s) {
      $("storyLoading").classList.add("hidden");
      showStoryDialog(s);
    }).catch(function(err) {
      $("storyLoading").classList.add("hidden");
      showToast("加载失败: " + err.message, true);
    });
    return;
  }
  showStoryDialog(story);
}

function showStoryDialog(story) {
  CURRENT_STORY_ID = story.id;
  $("storyDialogTitle").textContent = "📖 " + (story.title || "未命名");
  $("storyDialogContent").textContent = JSON.stringify(story, null, 2);
  $("storyDialogOverlay").classList.remove("hidden");
}

function closeStoryDialog() {
  $("storyDialogOverlay").classList.add("hidden");
  CURRENT_STORY_ID = null;
}

function copyStoryJson() {
  var text = $("storyDialogContent").textContent;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() {
      showToast("✅ 已复制到剪贴板");
    });
  } else {
    showToast("⚠️ 浏览器不支持剪贴板 API", true);
  }
}

function deleteStoryFromDialog() {
  if (!CURRENT_STORY_ID) return;
  deleteStory(CURRENT_STORY_ID, $("storyDialogTitle").textContent.replace("📖 ", ""));
}

/* ===== 删除故事 ===== */
function deleteStory(id, title) {
  if (!confirm("确认删除故事「" + title + "」？\n\n此操作不可撤销！")) return;

  api("/stories/" + encodeURIComponent(id), "DELETE")
    .then(function() {
      showToast("✅ 已删除: " + title);
      closeStoryDialog();
      // 重新加载
      loadAllData();
    })
    .catch(function(err) {
      showToast("❌ 删除失败: " + err.message, true);
    });
}

/* ===== 工具函数 ===== */
function escapeHtml(str) {
  var div = document.createElement("div");
  div.appendChild(document.createTextNode(str || ""));
  return div.innerHTML;
}

/* ===== 页面加载时读取 localStorage 缓存的连接信息 ===== */
(function() {
  try {
    var saved = JSON.parse(localStorage.getItem("ss-admin-conn") || "{}");
    // 如果从 Worker 同源访问，自动填入当前 origin
    if (!saved.host && location.origin && location.origin !== "null" && !location.origin.startsWith("file://")) {
      $("hostInput").value = location.origin;
    } else if (saved.host) {
      $("hostInput").value = saved.host;
    }
    if (saved.token) $("tokenInput").value = saved.token;
  } catch(_) {}
})();

// 保存连接信息
var origConnect = doConnect;
doConnect = function() {
  try {
    localStorage.setItem("ss-admin-conn", JSON.stringify({ host: $("hostInput").value.trim(), token: $("tokenInput").value.trim() }));
  } catch(_) {}
  origConnect();
};
</script>
</body>
</html>
